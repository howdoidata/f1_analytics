[project]
name = "f1_analytics"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pandas>=3.0,<3.1",
    "duckdb>=1.5,<1.6",
    "kagglehub>=1.0,<2",
]

[dependency-groups]
dev = ["pytest>=9.1,<10"]

[build-system]
requires = ["uv_build>=0.12.2,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

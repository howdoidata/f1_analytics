[project]
name = "f1_analytics"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    # fastf1 3.8.3 requires pandas<3.
    "pandas>=2.2,<3",
    "duckdb>=1.5,<1.6",
    "fastf1==3.8.3",
    "cryptography<50",
    # cryptography 49 ships no Intel-macOS wheel; keep that platform on 48.x.
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "requests>=2.32,<3",
    "pyjwt>=2.8,<3",
    "platformdirs>=4,<5",
    "dbt-duckdb==1.11.0",
    "dbt-core>=1.11,<1.12",
    # Report figures and rendering (Quarto's Jupyter engine; kaleido makes the PDF's static images).
    "plotly>=6.9,<7",
    "kaleido>=1.5,<2",
    "nbclient>=0.11,<0.12",
    "nbformat>=5.11,<5.12",
    "ipykernel>=7.4,<7.5",
    # The pit-stop count model (Poisson GLM); one minor version.
    "statsmodels~=0.14.5",
]

[project.scripts]
build = "f1_analytics.cli:build"
refresh = "f1_analytics.cli:refresh"
fetch-sessions = "f1_analytics.fetch_sessions:main"
fetch-weather = "f1_analytics.fetch_weather:main"
scenarios = "f1_analytics.scenarios:main"
gallery = "f1_analytics.gallery:cli"

[dependency-groups]
dev = ["pytest>=9.1,<10"]

[build-system]
requires = ["uv_build>=0.12.2,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

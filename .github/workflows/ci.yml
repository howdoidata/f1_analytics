name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync

      # Quarto lets the three @needs_quarto render tests in
      # tests/test_forecast_report.py run instead of skipping. It comes
      # before the build so a failed build still leaves the renders to run.
      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # dbt build on the committed data/raw/: every model and test must pass.
      # It runs first so tests/test_real_db.py reads the built file.
      - name: Build the DuckDB file
        run: uv run build

      # tests/conftest.py blocks all network access -- this suite
      # never needs F1TV/FastF1 credentials to run. It runs even when the
      # build fails; the real-DB test then fails because CI is set.
      - name: Run tests
        if: success() || failure()
        run: uv run pytest -v

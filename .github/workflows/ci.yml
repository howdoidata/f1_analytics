name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync

      # tests/conftest.py blocks all network access -- this suite
      # never needs F1TV/FastF1 credentials to run.
      - name: Run tests
        run: uv run pytest -v

      # dbt build on the committed data/raw/: every model and test must pass.
      - name: Build the DuckDB file
        run: uv run build

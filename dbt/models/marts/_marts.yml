version: 2

# Tests marked (V) replace a Stage 2 validation/ check; the rest replace the
# fail-loud checks the pandas loaders ran. Every test is error severity.
models:

  - name: races
    description: >
      One row per race (Jolpica races.csv).
    data_tests:
      - unique_combination:
          arguments:
            columns: [season, round]
    columns:
      - name: season
        data_tests:
          - not_null
      - name: round
        data_tests:
          - not_null
      - name: circuit_id
        description: (V) circuit_id -> circuits.
        data_tests:
          - relationships:
              arguments:
                to: ref('circuits')
                field: circuit_id

  - name: circuits
    description: >
      One row per circuit.
    columns:
      - name: circuit_id
        data_tests:
          - unique
          - not_null

  - name: drivers
    description: >
      One row per driver.
    columns:
      - name: driver_id
        description: (V) not_null.
        data_tests:
          - unique
          - not_null

  - name: constructors
    description: >
      One row per constructor.
    columns:
      - name: constructor_id
        description: (V) not_null.
        data_tests:
          - unique
          - not_null

  - name: results
    description: >
      Race classification, one row per car per race.
    columns:
      - name: season
        description: (V)
        data_tests:
          - not_null
      - name: round
        description: (V)
        data_tests:
          - not_null
      - name: driver_id
        description: (V) not_null and -> drivers.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('drivers')
                field: driver_id
      - name: constructor_id
        description: (V) -> constructors.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('constructors')
                field: constructor_id
      - name: position
        description: (V)
        data_tests:
          - not_null
      - name: points
        description: (V)
        data_tests:
          - not_null

  - name: sprint_results
    description: >
      Sprint classification, one row per car per sprint.
    columns:
      - name: season
        data_tests:
          - not_null
      - name: round
        data_tests:
          - not_null
      - name: driver_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('drivers')
                field: driver_id
      - name: constructor_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('constructors')
                field: constructor_id

  - name: qualifying
    description: >
      Qualifying classification.
    columns:
      - name: season
        data_tests:
          - not_null
      - name: round
        data_tests:
          - not_null
      - name: driver_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('drivers')
                field: driver_id
      - name: constructor_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('constructors')
                field: constructor_id

  - name: race_results_enriched
    description: >
      results left-joined to races (date, time_race, circuit_id, url).

  - name: driver_standings_by_round
    description: >
      Cumulative driver standings after every round (sprint points included, sprint wins not).
    data_tests:
      - unique_combination:
          arguments:
            columns: [season, round, driver_id]
    columns:
      - name: standing_rank
        data_tests:
          - not_null

  - name: constructor_standings_by_round
    description: >
      Cumulative constructor standings after every round.
    data_tests:
      - unique_combination:
          arguments:
            columns: [season, round, constructor_id]
    columns:
      - name: standing_rank
        data_tests:
          - not_null

  - name: final_driver_standings
    description: >
      Official season-end driver standings.
    columns:
      - name: driver_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('drivers')
                field: driver_id
      - name: constructor_id
        description: (V) not_null.
        data_tests:
          - not_null

  - name: final_constructor_standings
    description: >
      Official season-end constructor standings.
    columns:
      - name: constructor_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('constructors')
                field: constructor_id

  - name: raw_fastf1_laps
    description: >
      Every FastF1 lap, id-mapped by Driver code and Team name.
    columns:
      - name: season
        description: (V)
        data_tests:
          - not_null
      - name: round
        description: (V)
        data_tests:
          - not_null
      - name: driver_id
        description: (V) not_null and -> drivers.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('drivers')
                field: driver_id
      - name: constructor_id
        description: (V) -> constructors.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('constructors')
                field: constructor_id
      - name: Stint
        description: A lap with no Stint cannot be grouped into one.
        data_tests:
          - not_null

  - name: raw_fastf1_stints
    description: >
      One row per driver stint, derived from the laps.
    data_tests:
      - unique_combination:
          arguments:
            columns: [race_label, driver_id, stint_number]
    columns:
      - name: season
        description: (V)
        data_tests:
          - not_null
      - name: round
        description: (V)
        data_tests:
          - not_null
      - name: driver_id
        description: (V) not_null and -> drivers.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('drivers')
                field: driver_id
      - name: constructor_id
        description: (V) -> constructors.
        data_tests:
          - relationships:
              arguments:
                to: ref('constructors')
                field: constructor_id

  - name: raw_fastf1_weather
    description: >
      FastF1 track weather samples.
    columns:
      - name: season
        description: (V)
        data_tests:
          - not_null
      - name: round
        description: (V)
        data_tests:
          - not_null

  # --- Williams pit-stop forecast: stops, cars and practice stints ------------

  - name: pit_stops
    description: >
      The stop count of record (W1): one row per Jolpica pit stop, 2011 onwards,
      with the car's constructor from results and a stop_type from the FastF1
      track-status periods.
    data_tests:
      - unique_combination:
          arguments:
            columns: [season, round, driver_id, stop]
    columns:
      - name: season
        data_tests: [not_null]
      - name: round
        data_tests: [not_null]
      - name: driver_id
        data_tests: [not_null]
      - name: constructor_id
        description: constructorId of the results row with the same season, round and driver.
        data_tests: [not_null]
      - name: stop
        data_tests: [not_null]
      - name: lap
        data_tests: [not_null]
      - name: time
        description: Time of day of the stop, as Jolpica gives it.
        data_tests: [not_null]
      - name: duration_s
        description: >
          Pit-lane time in seconds. NULL where Jolpica has no duration.
      - name: stop_type
        description: >
          unknown when the race has no car_races row; otherwise red_flag when the
          lap is inside a red_flag period, sc_vsc when inside an sc or vsc period
          (both end laps included; red_flag wins an overlap), else normal.
          Penalty stops cannot be told apart and are normal.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [normal, sc_vsc, red_flag, unknown]

  - name: car_races
    description: >
      One row per car per race with a FastF1 summary (story 2's car_races.csv),
      typed. Values pass through as written.
    data_tests:
      - unique_combination:
          arguments:
            columns: [season, round, driver_id]
    columns:
      - name: season
        data_tests: [not_null]
      - name: round
        data_tests: [not_null]
      - name: driver_id
        data_tests: [not_null]
      - name: constructor_id
        data_tests: [not_null]
      - name: stops_fastf1
        description: >
          Pit-in laps in the FastF1 laps, as story 2 wrote it. Not the stop
          count: W1 counts stops from pit_stops.
      - name: rainfall
        description: True if FastF1 weather shows rain during the race window only (not the whole session).
      - name: deg_s_per_lap
        description: >
          Raw slope of lap time against tyre life, in seconds per lap: the
          lap-weighted mean of the dry stints' least-squares slopes. Not corrected
          for fuel burn, so it is often negative. NULL when no stint qualifies.

  - name: practice_stints
    description: >
      One row per practice stint, from every
      data/raw/fastf1_practice/<season>/<RR>-<slug>/<session>_stints.csv file.
    data_tests:
      - unique_combination:
          arguments:
            columns: [season, round, session, driver_id, stint]
    columns:
      - name: season
        data_tests: [not_null]
      - name: round
        data_tests: [not_null]
      - name: session
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [FP1, FP2, FP3]
      - name: driver_id
        data_tests: [not_null]
      - name: stint
        data_tests: [not_null]
      - name: laps
        data_tests: [not_null]

  - name: weather_forecasts
    description: >
      One row per race, forecast kind and forecast hour (UTC), from every
      data/raw/open_meteo/<kind>/<season>-<RR>.json file `uv run fetch-weather`
      writes, each for the race date and the day after (kind day_before: the
      Historical Forecast API, the backtest's weather; kind forecast: the live
      Forecast API, an upcoming race's weather for the scenario grid).
      precipitation_probability is 0-1; air_temp is in °C.
    data_tests:
      - unique_combination:
          arguments:
            columns: [season, round, kind, hour_utc]
    columns:
      - name: season
        data_tests: [not_null]
      - name: round
        data_tests: [not_null]
      - name: kind
        data_tests: [not_null]
      - name: hour_utc
        data_tests: [not_null]
      - name: endpoint
        data_tests: [not_null]
      - name: race_start_utc
        data_tests: [not_null]

  - name: race_incidents
    description: >
      One row per race with car_races rows (W5): incident is true when the
      race's FastF1 track-status periods hold an sc or red_flag period, false
      when they hold only vsc periods or none. The count model's incident
      covariate and incident chance read it.
    data_tests:
      - unique_combination:
          arguments:
            columns: [season, round]
    columns:
      - name: season
        data_tests: [not_null]
      - name: round
        data_tests: [not_null]
      - name: incident
        data_tests: [not_null]

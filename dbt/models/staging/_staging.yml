version: 2

# A Jolpica season/round that is empty or non-numeric would silently drop out of
# every season/round join, so it fails the build here.
models:
  - name: stg_jolpica__races
    columns:
      - name: season
        data_tests: [not_null]
      - name: round
        data_tests: [not_null]
  - name: stg_jolpica__results
    columns:
      - name: season
        data_tests: [not_null]
      - name: round
        data_tests: [not_null]
  - name: stg_jolpica__sprint_results
    columns:
      - name: season
        data_tests: [not_null]
      - name: round
        data_tests: [not_null]
  - name: stg_jolpica__qualifying
    columns:
      - name: season
        data_tests: [not_null]
      - name: round
        data_tests: [not_null]

  # FastF1: the season folder must be a number, and every extract's counts.json
  # must carry a numeric round.
  - name: stg_fastf1__laps
    columns:
      - name: season
        data_tests: [not_null]
  - name: stg_fastf1__weather
    columns:
      - name: season
        data_tests: [not_null]
  - name: stg_fastf1__counts
    data_tests:
      - unique_combination:
          arguments:
            columns: [season_folder, race_label]
    columns:
      - name: season
        data_tests: [not_null]
      - name: round
        data_tests: [not_null]
  - name: stg_fastf1__driver_code_map
    description: One row per FastF1 Driver code seen in the laps, with its resolution.
  - name: stg_fastf1__team_map
    description: One row per FastF1 Team name seen in the laps, with its resolution.

  # Pit stops and the FastF1 session summaries: a non-numeric season/round
  # would drop the row out of every join.
  - name: stg_jolpica__pit_stops
    columns:
      - name: season
        data_tests: [not_null]
      - name: round
        data_tests: [not_null]
  - name: stg_fastf1_summary__car_races
    columns:
      - name: season
        data_tests: [not_null]
      - name: round
        data_tests: [not_null]
  - name: stg_fastf1_summary__track_status_periods
    description: >
      Stays in staging: pit_stops reads it for stop_type. A status outside sc,
      vsc and red_flag would silently type its stops normal, so it fails the build.
    columns:
      - name: season
        data_tests: [not_null]
      - name: round
        data_tests: [not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [sc, vsc, red_flag]
      - name: start_lap
        data_tests: [not_null]
      - name: end_lap
        data_tests: [not_null]
  - name: stg_fastf1_practice__stints
    columns:
      - name: season
        data_tests: [not_null]
      - name: round
        data_tests: [not_null]
